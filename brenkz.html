<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brenkz</title>
<meta name="description" content="Meus links, vídeos e lives.">
<link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg">
<link rel="icon" type="image/png" href="/assets/img/favicon.png">
<link rel="alternate icon" href="assets/img/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--accent:#fff;--muted:rgba(255,255,255,.72);--glass:rgba(24,24,28,.38);--line:rgba(255,255,255,.2)}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;color:#fff;background:#0a0a0a;font:400 1rem/1.5 Outfit,system-ui,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid #fff;outline-offset:3px;border-radius:8px}
.bg-video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 60%;z-index:-2;background:#0a0a0a}
.bg-shade{position:fixed;inset:0;z-index:-1;background:rgba(0,0,0,.4)}
.topo{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:5rem 1rem 5rem}


/* perfil */
.perfil{padding:2rem 1.5rem 1.5rem;text-align:center}
.avatar{width:118px;height:118px;margin:0 auto;border-radius:50%;display:grid;place-items:center;overflow:hidden;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.25);font-size:2.8rem;font-weight:600}
.avatar img{width:100%;height:100%;object-fit:cover}
h1{margin-top:.6rem;font-size:2.1rem;font-weight:500;line-height:1.2;color:var(--accent)}
.frase{margin-top:.3rem;font-weight:500}
.ao-vivo{display:none;margin:.8rem auto 0;width:max-content;align-items:center;gap:.5rem;padding:.25rem .8rem;border-radius:999px;background:rgba(229,37,61,.22);border:1px solid rgba(229,37,61,.6);font-size:.85rem;font-weight:600}
.ao-vivo.on{display:flex}
.dot{width:8px;height:8px;border-radius:50%;background:#e5253d;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.3}}
.icones{display:flex;justify-content:center;gap:1rem;margin-top:1.1rem}
.icones a{position:relative;width:46px;height:46px;display:grid;place-items:center;transition:transform .15s}
.icones a:hover{transform:scale(1.12)}
.icones svg{width:36px;height:36px;fill:#fff;filter:drop-shadow(0 0 5px rgba(255,255,255,.35));transition:filter .25s}
.icones a[data-rede="youtube"]{--glow:#ff0000}
.icones a[data-rede="twitch"]{--glow:#9146ff}
.icones a[data-rede="discord"]{--glow:#5865f2}
.icones a:not(:hover):not(:focus-visible) svg{animation:respira 3.2s ease-in-out infinite}
.icones a:nth-child(2) svg{animation-delay:.5s!important}
.icones a:nth-child(3) svg{animation-delay:1s!important}
.icones a:hover svg,.icones a:focus-visible svg{filter:drop-shadow(0 0 6px var(--glow,#fff)) drop-shadow(0 0 18px var(--glow,#fff))}
@keyframes respira{50%{filter:drop-shadow(0 0 11px rgba(255,255,255,.7))}}
.visitas{display:flex;align-items:center;justify-content:center;gap:.5rem;margin-top:.9rem;color:#fff;font-weight:500;font-size:1.05rem;text-shadow:0 0 10px #fff,0 0 22px rgba(255,255,255,.55)}
.visitas[hidden]{display:none}
.visitas svg{width:26px;height:26px;fill:#fff;filter:drop-shadow(0 0 5px #fff) drop-shadow(0 0 14px rgba(255,255,255,.7))}
.icones a.is-live::after{content:"";position:absolute;top:2px;right:2px;width:11px;height:11px;border-radius:50%;background:#e5253d;border:2px solid #2a2a2e;animation:pulse 1.6s infinite}

/* player de música */
.player{display:flex;align-items:center;gap:1rem;padding:.85rem 1rem}
.capa{flex:none;width:66px;height:66px;border-radius:14px;border:0;cursor:pointer;background:rgba(255,255,255,.22);display:grid;place-items:center;transition:background .15s}
.capa:hover{background:rgba(255,255,255,.32)}
.player[hidden],.abrir-wrap[hidden]{display:none}
.player.surge{animation:surge .3s ease}
@keyframes surge{from{opacity:0;transform:translateY(-6px) scale(.98)}}
.abrir-wrap{position:relative;width:58px;height:58px}
.abrir{position:absolute;left:0;top:0;height:58px;max-width:58px;display:flex;align-items:center;border-radius:999px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(24px) saturate(1.3);-webkit-backdrop-filter:blur(24px) saturate(1.3);cursor:pointer;overflow:hidden;white-space:nowrap;transition:max-width .4s cubic-bezier(.4,0,.2,1)}
.abrir:hover,.abrir:focus-visible{max-width:min(380px,calc(100vw - 2rem))}
.abrir-ico{flex:none;width:56px;height:56px;display:grid;place-items:center}
.abrir-ico svg{width:26px;height:26px;fill:#fff}
.abrir-tit{padding-right:1.3rem;font-size:.95rem;font-weight:500;opacity:0;transform:translateX(-8px);transition:opacity .3s .08s,transform .4s cubic-bezier(.4,0,.2,1)}
.abrir:hover .abrir-tit,.abrir:focus-visible .abrir-tit{opacity:1;transform:none}
.abrir.tocando{animation:brilho 2.4s infinite}
@keyframes brilho{50%{box-shadow:0 0 0 9px rgba(255,255,255,.18)}}
.capa svg{width:36px;height:36px;fill:#fff}
.info{flex:1;min-width:0}
.titulo{font-size:.95rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barra{display:flex;align-items:center;gap:.6rem;color:var(--muted);font-size:.95rem}
.barra span{min-width:2.4em;font-variant-numeric:tabular-nums}
input.prog{--p:0%;flex:1;min-width:0;height:16px;background:transparent;cursor:pointer;-webkit-appearance:none;appearance:none}
input.prog::-webkit-slider-runnable-track{height:2px;background:linear-gradient(90deg,#fff var(--p),rgba(255,255,255,.3) var(--p))}
input.prog::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;margin-top:-4px;border-radius:50%;background:#fff}
input.prog::-moz-range-track{height:2px;background:rgba(255,255,255,.3)}
input.prog::-moz-range-progress{height:2px;background:#fff}
input.prog::-moz-range-thumb{width:10px;height:10px;border:0;border-radius:50%;background:#fff}
.ctrl{display:flex;align-items:center;gap:.5rem}
.ctrl button{background:none;border:0;cursor:pointer;display:grid;place-items:center;padding:.2rem}
.ctrl svg{width:22px;height:22px;fill:#fff}
.ctrl .pp svg{width:30px;height:30px}

/* vídeos (só aparece se houver vídeo configurado) */
.videos{padding:1rem 1.2rem}
.videos h2{font-size:.95rem;font-weight:600;color:var(--muted);margin-bottom:.4rem}
.v{display:grid;grid-template-columns:112px 1fr;gap:.9rem;align-items:center;padding:.45rem 0}
.v img{width:112px;aspect-ratio:16/9;object-fit:cover;border-radius:10px;background:rgba(255,255,255,.12)}
.v p{font-weight:500;line-height:1.3}
.v:hover p{text-decoration:underline;text-underline-offset:3px}

/* botão de mudo e tela de entrada */
.volume{position:fixed;left:1rem;top:1rem;z-index:5;display:flex;align-items:center;height:52px;max-width:52px;overflow:hidden;border-radius:14px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(24px) saturate(1.3);-webkit-backdrop-filter:blur(24px) saturate(1.3);transition:max-width .4s cubic-bezier(.4,0,.2,1)}
.volume:hover,.volume:focus-within,.volume.aberto{max-width:230px}
.mudo{flex:none;width:50px;height:50px;border:0;background:none;cursor:pointer;display:grid;place-items:center}
.mudo svg{width:26px;height:26px;fill:#fff}
input.vol{--v:50%;flex:none;width:130px;height:20px;margin:0 1.2rem 0 .1rem;background:transparent;cursor:pointer;opacity:0;transform:translateX(-8px);transition:opacity .3s .08s,transform .4s cubic-bezier(.4,0,.2,1);-webkit-appearance:none;appearance:none}
.volume:hover input.vol,.volume:focus-within input.vol,.volume.aberto input.vol{opacity:1;transform:none}
input.vol::-webkit-slider-runnable-track{height:8px;border-radius:99px;background:linear-gradient(90deg,#fff var(--v),rgba(255,255,255,.3) var(--v))}
input.vol::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;margin-top:-3px;border-radius:50%;background:#fff}
input.vol::-moz-range-track{height:8px;border-radius:99px;background:rgba(255,255,255,.3)}
input.vol::-moz-range-progress{height:8px;border-radius:99px;background:#fff}
input.vol::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:#fff}
.entrada{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.8rem;background:rgba(0,0,0,.5);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:0;cursor:pointer;transition:opacity .5s}
.entrada[hidden]{display:none}
.entrada.sai{opacity:0;pointer-events:none}
.entrada-nome{font-size:clamp(2.4rem,9vw,4.2rem);font-weight:600;letter-spacing:-.02em;color:var(--accent)}
.entrada-dica{color:var(--muted);animation:pulse 1.8s infinite}
.criador{position:fixed;right:1rem;bottom:1.4rem;z-index:5;display:inline-flex;align-items:center;height:48px;padding:0 1.1rem;border-radius:14px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(24px) saturate(1.3);-webkit-backdrop-filter:blur(24px) saturate(1.3);font-size:.95rem;font-weight:500;transition:background .2s,border-color .2s}
.criador:hover{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.4)}
.seta{position:fixed;left:50%;bottom:1.4rem;transform:translateX(-50%);z-index:5;width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(24px) saturate(1.3);-webkit-backdrop-filter:blur(24px) saturate(1.3);cursor:pointer;display:grid;place-items:center;transition:background .2s}
.seta:hover{background:rgba(60,60,66,.55)}
.seta svg{width:26px;height:26px;fill:#fff;animation:desce 1.8s ease-in-out infinite}
@keyframes desce{50%{transform:translateY(4px)}}

.setup{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4rem;padding:4rem 1rem}
.setup h2{font-size:1.7rem;font-weight:600;letter-spacing:-.01em}
.setup-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px;width:min(720px,100%)}
.setup-grid .card{width:auto;padding:1.2rem 1.3rem}
.setup-grid h3{font-size:1rem;font-weight:600;margin-bottom:.5rem}
.linha{display:flex;justify-content:space-between;gap:1rem;padding:.55rem 0;border-top:1px solid var(--line);font-size:.92rem}
.linha span{color:var(--muted)}
.linha b{font-weight:500;text-align:right}

/* versão compacta */
.perfil{width:min(240px,100%);padding:1.4rem 1.2rem 1.1rem}
.avatar{width:96px;height:96px;font-size:2.3rem}
h1{font-size:1.55rem;margin-top:.5rem}
.frase{font-size:.9rem;color:var(--muted)}
.icones{gap:.5rem;margin-top:.9rem}
.icones a{width:42px;height:42px}
.icones svg{width:30px;height:30px}
.player{width:min(240px,100%);display:grid;grid-template-columns:auto 1fr;grid-template-areas:"capa titulo" "barra barra" "ctrl ctrl";gap:.55rem .7rem;align-items:center;padding:.8rem .9rem}
.info{display:contents}
.capa{grid-area:capa;width:40px;height:40px;border-radius:12px}
.capa svg{width:22px;height:22px}
.titulo{grid-area:titulo;font-size:.9rem}
.barra{grid-area:barra;font-size:.8rem}
.ctrl{grid-area:ctrl;justify-content:center;gap:.8rem}
.videos{width:min(320px,100%)}
@media (max-width:520px){.v{grid-template-columns:96px 1fr}.v img{width:96px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<video class="bg-video" id="bgVideo" autoplay muted loop playsinline preload="metadata" poster="assets/img/fundo-poster.jpg" aria-hidden="true"><source src="assets/video/car.mp4" type="video/mp4"></video>
<div class="bg-shade" id="sombra" aria-hidden="true"></div>

<button class="entrada" id="entrada" type="button" hidden aria-label="Entrar no site e ligar a música">
  <span class="entrada-nome" id="entradaNome"></span>
  <span class="entrada-dica">Clique para entrar</span>
</button>
<div class="volume" id="volume">
  <button class="mudo" id="mudo" type="button" aria-label="Silenciar música" title="Silenciar"></button>
  <input class="vol" id="vol" type="range" min="0" max="100" value="50" aria-label="Volume">
</div>

<main>
  <div class="topo">
  <section class="card perfil">
    <div class="avatar" id="avatar" aria-hidden="true"></div>
    <h1 id="nome"></h1>
    <p class="frase" id="frase"></p>
    <a class="ao-vivo" id="aoVivo" href="#" target="_blank" rel="noopener"><span class="dot"></span>AO VIVO AGORA</a>
    <nav class="icones" id="icones" aria-label="Redes"></nav>
    <div class="visitas" id="visitas" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-8a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/></svg><span id="visitasN">0</span></div>
  </section>

  <div class="abrir-wrap" id="abrirWrap" hidden>
    <button class="abrir" id="abrir" type="button" aria-expanded="true" aria-controls="player" aria-label="Abrir player de música">
      <span class="abrir-ico" id="abrirIco"></span><span class="abrir-tit" id="abrirTit"></span>
    </button>
  </div>

  <section class="card player" id="player" aria-label="Player de música">
    <button class="capa" id="fechar" type="button" aria-label="Recolher player" title="Recolher"></button>
    <div class="info">
      <p class="titulo" id="titulo"></p>
      <div class="barra">
        <span id="atual">0:00</span>
        <input class="prog" id="prog" type="range" min="0" max="100" value="0" step="0.1" aria-label="Progresso da música">
        <span id="total">0:00</span>
      </div>
    </div>
    <div class="ctrl">
      <button class="pp" id="pp" type="button" aria-label="Pausar"></button>
      <button id="prox" type="button" aria-label="Próxima"></button>
    </div>
  </section>

  <section class="card videos" id="videos" hidden>
    <h2>Vídeos</h2>
    <div id="listaVideos"></div>
  </section>
  </div>

  <section class="setup" id="setup" aria-labelledby="setupTit">
    <h2 id="setupTit">Meu setup</h2>
    <div class="setup-grid" id="setupGrid"></div>
  </section>
</main>

<button class="seta" id="seta" type="button" aria-label="Ver meu setup" title="Ver meu setup">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.41 8.59 12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg>
</button>

<audio id="musica" preload="none"></audio>

<script>
/* ============ EDITE AQUI ============ */
const CONFIG = {
  nome: "Brenkz",
  avatar: "/assets/img/avatar.jpg",                                  // para usar foto: coloque em assets/img/ e escreva "assets/img/avatar.jpg"
  frase: "",
  twitchCanal: "brenkzftw",                    // só o nome do canal
  links: [
    ["YouTube", "https://www.youtube.com/@brenkzftw"],
    ["Twitch",  "https://www.twitch.tv/brenkzftw"],
    ["Discord", "https://discord.gg/SEU-CONVITE"]
  ],
  musicas: [
    { arquivo: "/assets/audio/musica.mp3", titulo: "GROOVY, B Jack$ - jersey luv" }
  ],
  // ID do vídeo = o que vem depois de "v=" no link do YouTube. Sem IDs, a seção some.
  videos: [
    ["COLE_O_ID_1", "Título do vídeo 1"],
    ["COLE_O_ID_2", "Título do vídeo 2"]
  ],
  // Troque os textos pelos seus modelos. Pode apagar linhas ou categorias inteiras.
  setup: [
    { titulo: "Periféricos", itens: [
      ["Mouse", "Seu modelo aqui"], ["Teclado", "Seu modelo aqui"], ["Headset", "Seu modelo aqui"],
      ["Monitor", "Seu modelo aqui"], ["Mousepad", "Seu modelo aqui"], ["Microfone", "Seu modelo aqui"]
    ]},
    { titulo: "Peças do PC", itens: [
      ["Processador", "Seu modelo aqui"], ["Placa de vídeo", "Seu modelo aqui"], ["Placa-mãe", "Seu modelo aqui"],
      ["Memória RAM", "Seu modelo aqui"], ["Armazenamento", "Seu modelo aqui"], ["Fonte", "Seu modelo aqui"], ["Gabinete", "Seu modelo aqui"]
    ]}
  ]
};
/* ================================== */

const $ = id => document.getElementById(id);
const svg = d => `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${d}"/></svg>`;
const IC = {
  youtube: svg("M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2C0 8.1 0 12 0 12s0 3.9.5 5.8a3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1c.5-1.9.5-5.8.5-5.8s0-3.9-.5-5.8zM9.6 15.6V8.4l6.2 3.6-6.2 3.6z"),
  twitch: svg("M11.6 11.2h1.8V6.4h-1.8v4.8zm4.9 0h1.8V6.4h-1.8v4.8zM6 0 1.7 4.3v15.4h5.2V24h2.9l4.3-4.3h4.3L22.3 14V0H6zm14.6 12.9-3.4 3.4h-5.4l-2.9 2.9v-2.9H6.1V1.7h14.5v11.2z"),
  discord: svg("M20.3 4.4A19.8 19.8 0 0 0 15.4 3l-.2.5a18 18 0 0 0-6.4 0L8.6 3a19.8 19.8 0 0 0-4.9 1.4C.6 9 0 13.5.3 18a20 20 0 0 0 6 3l1.3-2.1-2-1 .5-.4a14.2 14.2 0 0 0 12 0l.5.4-2 1 1.3 2.1a20 20 0 0 0 6-3c.4-5.2-.7-9.7-3.6-13.6zM8.5 15.3c-1.2 0-2.2-1.1-2.2-2.4s1-2.4 2.2-2.4 2.2 1.1 2.2 2.4-1 2.4-2.2 2.4zm7 0c-1.2 0-2.2-1.1-2.2-2.4s1-2.4 2.2-2.4 2.2 1.1 2.2 2.4-1 2.4-2.2 2.4z"),
  nota: svg("M12 3v10.55c-.59-.34-1.27-.55-2-.55a4 4 0 1 0 4 4V7h4V3h-6z"),
  prox: svg("M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"),
  play: svg("M8 5v14l11-7z"),
  pausa: svg("M6 19h4V5H6v14zm8-14v14h4V5h-4z"),
  somOn: svg("M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"),
  somOff: svg("M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51A8.8 8.8 0 0 0 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3 3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06a9 9 0 0 0 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4 9.91 6.09 12 8.18V4z")
};

/* perfil */
document.title = CONFIG.nome;
$("nome").textContent = CONFIG.nome;
$("frase").textContent = CONFIG.frase;
$("entradaNome").textContent = CONFIG.nome;
const av = $("avatar");
if (CONFIG.avatar) { const i = new Image(); i.src = CONFIG.avatar; i.alt = ""; av.appendChild(i); }
else av.textContent = CONFIG.nome.trim().charAt(0).toUpperCase();
$("icones").innerHTML = CONFIG.links.map(([n, u]) =>
  `<a href="${u}" target="_blank" rel="noopener" aria-label="${n}" title="${n}" data-rede="${n.toLowerCase()}">${IC[n.toLowerCase()] || n}</a>`).join("");

/* vídeos (só os que têm ID de verdade) */
const reais = CONFIG.videos.filter(v => !v[0].startsWith("COLE"));
if (reais.length){
  $("videos").hidden = false;
  $("listaVideos").innerHTML = reais.map(([id, t]) =>
    `<a class="v" href="https://www.youtube.com/watch?v=${id}" target="_blank" rel="noopener"><img src="https://i.ytimg.com/vi/${id}/mqdefault.jpg" alt="" loading="lazy"><p>${t}</p></a>`).join("");
}

/* player de música */
const m = $("musica"), L = CONFIG.musicas;
let faixa = 0;
$("fechar").innerHTML = IC.nota; $("abrirIco").innerHTML = IC.nota; $("prox").innerHTML = IC.prox;
m.loop = L.length === 1; m.volume = 0.5;
const fmt = s => isFinite(s) ? Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0") : "0:00";
function icones(){ $("abrir").classList.toggle("tocando", !m.paused); $("pp").innerHTML = m.paused ? IC.play : IC.pausa; $("pp").setAttribute("aria-label", m.paused ? "Tocar" : "Pausar"); }
function carregar(n, tocar){
  faixa = (n + L.length) % L.length;
  m.src = L[faixa].arquivo; $("titulo").textContent = $("abrirTit").textContent = L[faixa].titulo;
  if (tocar) m.play().catch(() => {});
}
carregar(0, false); icones();
$("pp").onclick = () => m.paused ? m.play().catch(() => {}) : m.pause();
$("prox").onclick = () => carregar(faixa + 1, true);
m.addEventListener("play", icones); m.addEventListener("pause", icones);
m.addEventListener("ended", () => carregar(faixa + 1, true));
m.addEventListener("loadedmetadata", () => $("total").textContent = fmt(m.duration));
m.addEventListener("timeupdate", () => {
  const p = m.duration ? (m.currentTime / m.duration) * 100 : 0;
  $("prog").value = p; $("prog").style.setProperty("--p", p + "%"); $("atual").textContent = fmt(m.currentTime);
});
$("prog").addEventListener("input", e => { if (m.duration) m.currentTime = (e.target.value / 100) * m.duration; });

/* abrir e recolher o player (ícone <-> faixa completa) */
function mostrarPlayer(abrir){
  const pl = $("player");
  pl.hidden = !abrir; $("abrirWrap").hidden = abrir;
  $("abrir").setAttribute("aria-expanded", abrir);
  if (abrir){ pl.classList.remove("surge"); void pl.offsetWidth; pl.classList.add("surge"); }
  else $("abrir").focus();
}
$("abrir").onclick = () => mostrarPlayer(true);
$("fechar").onclick = () => mostrarPlayer(false);

/* botão de silenciar (canto superior esquerdo) */
const vol = $("vol"), caixa = $("volume");
let fatorRolagem = 1;   // 1 = no topo; vai a 0 conforme a pessoa rola a página
function aplicaVolume(){ m.volume = (vol.value / 100) * fatorRolagem; }
function iconeMudo(){
  const mudo = m.muted || +vol.value === 0;
  $("mudo").innerHTML = mudo ? IC.somOff : IC.somOn;
  $("mudo").title = mudo ? "Ativar som" : "Silenciar";
  $("mudo").setAttribute("aria-label", $("mudo").title);
}
/* no celular não existe "passar o mouse": o primeiro toque abre a barra, o segundo silencia */
let tToque, soAbriu = false;
function mantem(){ clearTimeout(tToque); tToque = setTimeout(() => caixa.classList.remove("aberto"), 3500); }
$("mudo").addEventListener("pointerdown", e => {
  if (e.pointerType === "mouse") return;
  soAbriu = !caixa.classList.contains("aberto");
  caixa.classList.add("aberto"); mantem();
});
$("mudo").onclick = () => {
  if (soAbriu) { soAbriu = false; return; }
  if (+vol.value === 0) { vol.value = 50; vol.style.setProperty("--v", "50%"); aplicaVolume(); }
  m.muted = !m.muted; iconeMudo();
};
vol.addEventListener("input", () => {
  m.muted = false; aplicaVolume();
  vol.style.setProperty("--v", vol.value + "%"); iconeMudo(); mantem();
});
iconeMudo();

/* tenta tocar ao entrar; se o navegador bloquear, mostra "Clique para entrar" */
const entrada = $("entrada");
entrada.addEventListener("click", () => {
  m.play().catch(() => {});
  entrada.classList.add("sai"); setTimeout(() => { entrada.hidden = true; }, 500);
});
m.play().catch(() => { entrada.hidden = false; entrada.focus(); });

/* setup (periféricos e peças do PC) */
$("setupGrid").innerHTML = CONFIG.setup.map(c =>
  `<div class="card"><h3>${c.titulo}</h3>${c.itens.map(([r, v]) => `<div class="linha"><span>${r}</span><b>${v}</b></div>`).join("")}</div>`).join("");
const reduz = matchMedia("(prefers-reduced-motion: reduce)").matches;
$("seta").onclick = () => $("setup").scrollIntoView({ behavior: reduz ? "auto" : "smooth" });

/* ao rolar: a música vai diminuindo até parar; ao voltar para o topo, ela volta */
let pausadaPorRolagem = false, esperando = false;
function aoRolar(){
  esperando = false;
  const prog = Math.min(1, Math.max(0, scrollY / (innerHeight * 0.9)));
  fatorRolagem = 1 - prog;
  aplicaVolume();
  $("seta").style.opacity = Math.max(0, 1 - prog * 3);
  $("seta").style.pointerEvents = prog > 0.3 ? "none" : "auto";
  $("sombra").style.background = `rgba(0,0,0,${0.4 + 0.25 * prog})`;
  if (fatorRolagem === 0 && !m.paused){ pausadaPorRolagem = true; m.pause(); }
  else if (fatorRolagem > 0 && pausadaPorRolagem){ pausadaPorRolagem = false; m.play().catch(() => {}); }
}
addEventListener("scroll", () => { if (!esperando){ esperando = true; requestAnimationFrame(aoRolar); } }, { passive: true });
aoRolar();

/* vídeo de fundo: pausa se a pessoa prefere menos movimento */
if (matchMedia("(prefers-reduced-motion: reduce)").matches) $("bgVideo").pause();

/* Twitch: avisa quando o canal estiver ao vivo */
const twLink = [...document.querySelectorAll("#icones a")].find(a => a.href.includes("twitch.tv"));
if (twLink) $("aoVivo").href = twLink.href;
function setLive(on){
  $("aoVivo").classList.toggle("on", on);
  if (twLink){ twLink.classList.toggle("is-live", on); twLink.title = twLink.ariaLabel = on ? "Twitch (ao vivo agora)" : "Twitch"; }
}
async function checarLive(){
  try{
    const r = await fetch(`https://decapi.me/twitch/uptime/${encodeURIComponent(CONFIG.twitchCanal)}`, {cache:"no-store"});
    const t = (await r.text()).toLowerCase();
    setLive(!/offline|not found|could not|error|invalid/.test(t) && /(second|minute|hour|day)/.test(t));
  }catch(e){}
}
if (CONFIG.twitchCanal && CONFIG.twitchCanal !== "SEUCANAL"){ checarLive(); setInterval(checarLive, 60000); }

/* contador de visitas */
(async()=>{try{
  const ja=localStorage.getItem("visitou-brenkz");
  const r=await fetch("https://painel-brenkz.bre-uccelli.workers.dev/view",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({p:"brenkz",inc:!ja})});
  const j=await r.json(); if(typeof j.n!=="number")return;
  localStorage.setItem("visitou-brenkz","1");
  document.getElementById("visitasN").textContent=j.n.toLocaleString("pt-BR");
  document.getElementById("visitas").hidden=false;
}catch(e){}})();
</script>
