<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Entrar · Brenkz</title>
<link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
<link rel="icon" type="image/png" href="assets/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0b0712;--card:#150f20;--line:#2d2240;--ink:#f4f1fa;--mut:#a69fb8;--ac:#8b5cf6;--acd:#3b2470;--dc:#5865f2;--err:#ff8a9a;--font:"Outfit",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(800px 480px at 50% -60px,#3b1d70,transparent 70%),var(--bg);color:var(--ink);font:16px/1.5 var(--font);display:flex;flex-direction:column;align-items:center;padding:28px 16px}
a{color:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.logo{font-size:24px;font-weight:600;text-decoration:none;margin-bottom:28px}
.logo b{color:var(--ac)}
.box{width:min(420px,100%);background:var(--card);border:1px solid var(--line);border-radius:22px;padding:30px 28px}
h1{font-size:24px;font-weight:600;margin:0 0 8px}
p.sub{color:var(--mut);margin:0 0 24px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:14px 18px;border-radius:14px;border:1px solid var(--ac);background:var(--acd);color:var(--ink);font:inherit;font-weight:500;cursor:pointer;text-decoration:none}
.btn:hover{background:#4a2c8a}
.btn:disabled{opacity:.6;cursor:wait}
.btn.dc{background:var(--dc);border-color:var(--dc)}
.btn.dc:hover{background:#4752c4}
.btn.ghost{background:none;border-color:var(--line);margin-top:10px}
.btn svg{width:22px;height:22px;fill:currentColor}
.note{color:var(--mut);font-size:13.5px;margin:18px 0 0;text-align:center}
.msg{min-height:22px;margin:14px 0 0;font-size:14px;color:var(--err);text-align:center}
.me{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);border-radius:14px;margin-bottom:18px}
.me img,.me i{width:48px;height:48px;border-radius:50%;background:#33303c;display:grid;place-items:center;font-style:normal;font-weight:600;flex:none}
.me small{display:block;color:var(--mut)}
[hidden]{display:none!important}
</style>
</head>
<body>
<a class="logo" href="index.html">meu<b>perfil</b></a>

<div class="box">
  <section id="vin">
    <h1>Entre com o Discord</h1>
    <p class="sub">Sua conta é criada automaticamente no primeiro acesso. Não precisa de senha.</p>
    <button class="btn dc" id="go" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.3 4.4A17 17 0 0 0 16.1 3l-.2.4a15 15 0 0 1 3.7 1.9 14 14 0 0 0-11.2 0A15 15 0 0 1 12.1 3.4L11.9 3a17 17 0 0 0-4.2 1.4C5 8.4 4.3 12.3 4.6 16.1a17 17 0 0 0 5.2 2.6l1.1-1.8a11 11 0 0 1-1.7-.8l.4-.3a12 12 0 0 0 10.4 0l.4.3a11 11 0 0 1-1.7.8l1.1 1.8a17 17 0 0 0 5.2-2.6c.4-4.4-.7-8.3-2.7-11.7zM9.7 13.8c-1 0-1.8-.9-1.8-2s.8-2 1.8-2 1.8.9 1.8 2-.8 2-1.8 2zm6.6 0c-1 0-1.8-.9-1.8-2s.8-2 1.8-2 1.8.9 1.8 2-.8 2-1.8 2z"/></svg>Entrar com o Discord</button>
    <p class="note">Usamos só o seu id, nome e avatar do Discord. Nunca a sua senha nem as suas mensagens.</p>
  </section>

  <section id="vok" hidden>
    <h1>Tudo pronto</h1>
    <p class="sub">Você está dentro. Abra o painel para montar a sua página.</p>
    <div class="me"><img id="av" alt="" hidden><i id="avl"></i><div><b id="dn"></b><small id="un"></small></div></div>
    <a class="btn" href="painel.html">Ir para o painel</a>
    <button class="btn ghost" id="out" type="button">Sair da conta</button>
  </section>

  <p class="msg" id="msg" role="status" aria-live="polite"></p>
</div>

<script>
(function(){
var API="https://painel-brenkz.bre-uccelli.workers.dev";
var TK="conta-token",NN="conta-nonce";
var $=function(i){return document.getElementById(i)};
function msg(t){$("msg").textContent=t||""}
function show(ok){$("vin").hidden=ok;$("vok").hidden=!ok}

$("go").onclick=function(){
  var a=new Uint8Array(24);crypto.getRandomValues(a);
  var n=btoa(String.fromCharCode.apply(null,a)).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
  localStorage.setItem(NN,n);
  $("go").disabled=true;
  location.href=API+"/discord/start?n="+encodeURIComponent(n);
};
$("out").onclick=function(){localStorage.removeItem(TK);msg("");show(false)};

function carregar(irParaPainel){
  var t=localStorage.getItem(TK);if(!t){show(false);return}
  fetch(API+"/me",{headers:{Authorization:"Bearer "+t}})
    .then(function(r){if(!r.ok)throw 0;return r.json()})
    .then(function(me){
      show(true);
      var d=me.discord||{};
      $("dn").textContent=d.name||me.user;$("un").textContent="@"+me.user;
      $("avl").textContent=(d.name||me.user)[0].toUpperCase();
      if(d.avatar){$("av").src=d.avatar;$("av").hidden=false;$("avl").hidden=true}
      if(irParaPainel)setTimeout(function(){location.href="painel.html"},900);
    })
    .catch(function(){localStorage.removeItem(TK);show(false)});
}

/* volta do Discord: o servidor manda o token no trecho depois do # */
var h=new URLSearchParams(location.hash.slice(1)),entrou=false;
if(h.get("t")){
  if(h.get("n")&&h.get("n")===localStorage.getItem(NN)){localStorage.setItem(TK,h.get("t"));entrou=true}
  else msg("Não foi possível confirmar o login. Tente de novo.");
  localStorage.removeItem(NN);
}
var q=new URLSearchParams(location.search);
if(q.get("erro"))msg("Não foi possível entrar com o Discord. Tente de novo.");
if(location.hash||location.search)history.replaceState(null,"","conta.html");
carregar(entrou);
})();
</script>
</body>
</html>
